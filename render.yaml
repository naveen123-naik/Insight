services:
  # 1. Python FastAPI AI Engine
  - type: web
    name: insightai-engine
    env: python
    region: singapore
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # 2. Node.js Express Gateway
  - type: web
    name: insightai-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: FASTAPI_URL
        value: https://insightai-engine.onrender.com
